<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hl7-bench</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d232b; --muted: #5b6573; --line: #d9dee5;
  --accent: #2f6fdb; --accent-ink: #ffffff; --soft: #eef3fc;
  --ok-bg: #e3f4e6; --ok-ink: #145c2a; --bad-bg: #fde8e8; --bad-ink: #8a1c1c; --warn-bg: #fff4d6; --warn-ink: #6b4b00;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --ink: #e3e7ee; --muted: #9aa4b2; --line: #313844;
    --accent: #6c9cf0; --accent-ink: #0d1420; --soft: #1f2a3d;
    --ok-bg: #173622; --ok-ink: #9be0ae; --bad-bg: #3d1a1a; --bad-ink: #f3a3a3; --warn-bg: #3a3014; --warn-ink: #f0d58a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 4px 22px; align-items: baseline; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.kv { color: var(--muted); font-size: 12.5px; }
.kv b { color: var(--ink); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.kv b.bad { color: var(--bad-ink); }
#servers { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px; }
#servers:not(:empty) { padding: 10px 20px 0; }
.srv { background: var(--ok-bg); color: var(--ok-ink); border-radius: 6px; padding: 5px 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.srv a { color: inherit; font-weight: 600; }
main { display: grid; grid-template-columns: 250px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
nav { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; position: sticky; top: 12px; }
nav h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 8px 4px; }
nav button { display: block; width: 100%; text-align: left; border: none; background: none; color: var(--ink); padding: 6px 8px; border-radius: 5px; font: inherit; cursor: pointer; }
nav button:hover { background: var(--soft); }
nav button.on { background: var(--accent); color: var(--accent-ink); }
nav button .dot { float: right; color: var(--ok-ink); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
section h2 { margin: 0 0 4px; font-size: 18px; }
.does { color: var(--muted); margin: 0 0 14px; }
.row { display: grid; grid-template-columns: 160px 1fr; gap: 8px; align-items: start; margin: 8px 0; }
.row label { color: var(--muted); padding-top: 5px; font-size: 13px; }
.row input[type=text], .row select { font: 13px var(--mono); padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); width: 100%; }
.row .help { font-size: 12px; color: var(--muted); margin-top: 3px; }
.row.check { grid-template-columns: 160px 1fr; }
.actions { display: flex; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; align-items: center; }
button.btn { font: inherit; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn:disabled { opacity: .5; cursor: default; }
.cmd { display: flex; gap: 8px; align-items: center; background: var(--soft); border-radius: 6px; padding: 7px 10px; margin-top: 10px; font: 12.5px var(--mono); overflow-x: auto; }
.cmd code { flex: 1; white-space: pre; }
.cmd button { font: 12px system-ui, sans-serif; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.problems { background: var(--bad-bg); color: var(--bad-ink); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; margin-top: 10px; font-size: 13px; }
.exit { font-size: 13px; margin-top: 8px; padding: 6px 10px; border-radius: 6px; }
.exit.ok { background: var(--ok-bg); color: var(--ok-ink); }
.exit.bad { background: var(--bad-bg); color: var(--bad-ink); }
pre.out { font: 12.5px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 10px 0 0; max-height: 62vh; overflow: auto; white-space: pre; tab-size: 4; min-height: 60px; }
pre.out:empty::before { content: "Output appears here."; color: var(--muted); }
.link { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>hl7-bench</h1>
  <span class="kv">workspace <b id="e-root">…</b></span>
  <span class="kv">spec <b id="e-spec">…</b></span>
  <span class="kv">engine <b id="e-engine">…</b></span>
  <span class="kv">IRIS_LAB_DIR <b id="e-lab">…</b></span>
</header>
<div id="servers"></div>

<main>
  <nav id="nav"></nav>
  <section id="tool">
    <h2 id="t-title"></h2>
    <p class="does" id="t-does"></p>
    <form id="form" autocomplete="off"></form>
    <div class="actions">
      <button class="btn primary" id="run">Run</button>
      <button class="btn" id="stop" disabled>Stop</button>
      <span class="kv" id="t-link"></span>
    </div>
    <div id="problems"></div>
    <div class="cmd" id="cmdbox" hidden><code id="cmd"></code><button id="copy" type="button">Copy</button></div>
    <div id="exit"></div>
    <pre class="out" id="out"></pre>
  </section>
</main>

<datalist id="dl-message"></datalist>
<datalist id="dl-class"></datalist>
<datalist id="dl-file"></datalist>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const H = { "content-type": "application/json", "x-hl7-bench": "1" };

let tools = [], current = null, runId = null, reader = null;

// Per-viewer convenience only: the last values typed. The page works without it.
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("hl7bench:" + k) || "null"); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("hl7bench:" + k, JSON.stringify(v)); } catch { /* private window */ } },
};

function valuesFor(tool) {
  const saved = store.get("tool:" + tool.id) || {};
  const out = {};
  for (const a of tool.args) {
    const shared = a.shared ? store.get("shared:" + a.shared) : null;
    out[a.name] = saved[a.name] ?? shared ?? (a.kind === "choice" ? a.choices[0].value : a.kind === "flag" ? false : "");
  }
  return out;
}

function renderNav() {
  const groups = [...new Set(tools.map((t) => t.group))];
  $("nav").innerHTML = groups.map((g) =>
    `<h3>${esc(g)}</h3>` + tools.filter((t) => t.group === g).map((t) =>
      `<button data-id="${t.id}" class="${current && current.id === t.id ? "on" : ""}">${esc(t.title)}<span class="dot" id="dot-${t.id}"></span></button>`).join("")).join("");
  $("nav").querySelectorAll("button").forEach((b) => b.onclick = () => select(b.dataset.id));
}

function select(id) {
  if (reader && current && !current.server) { /* leave the run streaming into its own output */ }
  current = tools.find((t) => t.id === id);
  store.set("last", id);
  renderNav();
  $("t-title").textContent = current.title;
  $("t-does").textContent = current.does;
  const v = valuesFor(current);
  $("form").innerHTML = current.args.length === 0
    ? `<p class="does">No options. Run it.</p>`
    : current.args.map((a) => {
      if (a.kind === "flag") {
        return `<div class="row check"><label></label><div><label style="color:var(--ink)"><input type="checkbox" name="${a.name}" ${v[a.name] ? "checked" : ""}> ${esc(a.label)}</label>${a.help ? `<div class="help">${esc(a.help)}</div>` : ""}</div></div>`;
      }
      if (a.kind === "choice") {
        return `<div class="row"><label>${esc(a.label)}</label><div><select name="${a.name}">${a.choices.map((c) => `<option value="${esc(c.value)}" ${c.value === v[a.name] ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></div></div>`;
      }
      const list = ["message", "class", "file"].includes(a.kind) ? `list="dl-${a.kind}"` : "";
      return `<div class="row"><label>${esc(a.label)}${a.required ? "" : " <span style='opacity:.6'>(optional)</span>"}</label><div><input type="text" name="${a.name}" ${list} spellcheck="false" placeholder="${esc(a.placeholder || (list ? "pick or type a path in this folder" : ""))}" value="${esc(v[a.name] || "")}">${a.help ? `<div class="help">${esc(a.help)}</div>` : ""}</div></div>`;
    }).join("");
  $("form").onsubmit = (e) => { e.preventDefault(); run(); };
  $("problems").innerHTML = ""; $("exit").innerHTML = ""; $("out").textContent = "";
  $("cmdbox").hidden = true; $("t-link").innerHTML = "";
  syncServerControls();
}

function formValues() {
  const out = {};
  for (const a of current.args) {
    const el = $("form").elements[a.name];
    out[a.name] = a.kind === "flag" ? el.checked : el.value;
  }
  return out;
}

function remember(vals) {
  store.set("tool:" + current.id, vals);
  for (const a of current.args) if (a.shared && vals[a.name]) store.set("shared:" + a.shared, vals[a.name]);
}

async function run() {
  const tool = current;
  const vals = formValues();
  remember(vals);
  $("problems").innerHTML = ""; $("exit").innerHTML = ""; $("out").textContent = ""; $("t-link").innerHTML = "";
  $("run").disabled = true;
  let res;
  try {
    res = await fetch("/run", { method: "POST", headers: H, body: JSON.stringify({ tool: tool.id, values: vals }) });
  } catch (e) {
    $("problems").innerHTML = `<div class="problems">Could not reach the home server: ${esc(e)}</div>`;
    $("run").disabled = false; return;
  }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    $("problems").innerHTML = `<div class="problems">${esc(j.error || res.statusText)}</div>`;
    $("run").disabled = false; return;
  }
  $("stop").disabled = false;
  reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", text = "";
  const out = $("out");
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) !== -1 || buf.length > 4096) {
      const cut = nl === -1 ? buf.length : nl + 1;
      const line = buf.slice(0, cut); buf = buf.slice(cut);
      if (line.startsWith("RUN|")) { runId = line.slice(4).trim(); continue; }
      if (line.startsWith("CMD|")) { $("cmd").textContent = line.slice(4).trim(); $("cmdbox").hidden = false; continue; }
      if (line.startsWith("EXIT|")) { showExit(Number(line.slice(5))); continue; }
      text += line;
      if (current === tool) {
        out.textContent = text;
        out.scrollTop = out.scrollHeight;
        const m = /(https?:\/\/127\.0\.0\.1:\d+)/.exec(line);
        if (tool.server && m) $("t-link").innerHTML = `running at <a class="link" href="${m[1]}" target="_blank" rel="noopener">${m[1]}</a>`;
      }
      if (tool.server) refreshServers();
    }
  }
  if (buf && current === tool) { out.textContent = text + buf; }
  reader = null; runId = null;
  $("run").disabled = false; $("stop").disabled = true;
  refreshServers();
}

function showExit(code) {
  $("exit").innerHTML = code === 0
    ? `<div class="exit ok">Finished: exit 0.</div>`
    : `<div class="exit bad">Exit ${code}. The output above says why; the first error line is usually the one that matters.</div>`;
}

async function stop(id) {
  await fetch("/stop", { method: "POST", headers: H, body: JSON.stringify({ id: id || runId }) });
  refreshServers();
}

let servers = [];
async function refreshServers() {
  try { servers = await (await fetch("/running")).json(); } catch { return; }
  const live = servers.filter((s) => tools.find((t) => t.id === s.tool && t.server));
  $("servers").innerHTML = live.map((s) => {
    const t = tools.find((x) => x.id === s.tool);
    return `<div class="srv">${esc(t.title)} ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>` : "(starting…)"} <button class="btn" data-stop="${s.id}" style="padding:2px 8px">Stop</button></div>`;
  }).join("");
  $("servers").querySelectorAll("[data-stop]").forEach((b) => b.onclick = () => stop(b.dataset.stop));
  for (const t of tools) { const d = $("dot-" + t.id); if (d) d.textContent = live.some((s) => s.tool === t.id) ? "●" : ""; }
  syncServerControls();
}

function syncServerControls() {
  if (!current || !current.server) return;
  const s = servers.find((x) => x.tool === current.id);
  if (s && s.url) $("t-link").innerHTML = `running at <a class="link" href="${s.url}" target="_blank" rel="noopener">${s.url}</a>`;
}

$("run").onclick = run;
$("stop").onclick = () => stop();
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("cmd").textContent); $("copy").textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents($("cmd")); getSelection().removeAllRanges(); getSelection().addRange(r); $("copy").textContent = "Selected"; }
  setTimeout(() => ($("copy").textContent = "Copy"), 1200);
};

(async () => {
  const j = await (await fetch("/tools")).json();
  tools = j.tools;
  $("e-root").textContent = j.root;
  $("e-spec").textContent = j.env.spec;
  if (!j.env.specExists) { $("e-spec").classList.add("bad"); $("e-spec").title = "This file is not there. The spec tools will refuse; the class tools do not need it."; }
  $("e-engine").textContent = `${j.env.engine} · ${j.env.namespace}`;
  $("e-lab").textContent = j.env.labDir;
  for (const k of ["message", "class", "file"]) $("dl-" + k).innerHTML = (j.files[k] || []).map((f) => `<option value="${esc(f)}">`).join("");
  const last = store.get("last");
  select(tools.some((t) => t.id === last) ? last : tools[0].id);
  refreshServers();
})();
</script>
</body>
</html>
