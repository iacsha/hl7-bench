<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hl7-bench</title>
<style>
:root {
  --bg: #ffffff; --panel: #f6f7f9; --border: #d7dbe0; --text: #1b1f24;
  --muted: #6b737c; --accent: #2f6feb; --ok: #1a7f37; --bad: #b3261e;
  --warn: #8a6100; --warn-bg: #fff8e1;
  --chg-bg: #fff3c4; --chg-text: #6b4e00; --seg: #7b3fbf; --sep: #9aa2ab;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #161a20; --border: #2a3039; --text: #e4e7eb;
    --muted: #8b939d; --accent: #4d8dfd; --ok: #4ac26b; --bad: #ff6b60;
    --warn: #ffdf7a; --warn-bg: #3a2d00;
    --chg-bg: #4a3a00; --chg-text: #ffdf7a; --seg: #c08bff; --sep: #6b737c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 10px; padding: 9px 14px;
  border-bottom: 1px solid var(--border); background: var(--panel);
  flex: 0 0 auto; flex-wrap: wrap;
}
h1 { font-size: 14px; margin: 0; font-weight: 600; }
h1 span { color: var(--muted); font-weight: 400; }
button {
  font: inherit; font-weight: 600; padding: 5px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:disabled { opacity: .55; cursor: default; }
button.tiny {
  font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
  color: var(--muted);
}
kbd {
  font: 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; color: var(--muted);
}
#autosave {
  font: 11.5px var(--mono); color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px;
}
#status { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
#status.draft { color: var(--muted); }
#status.ok { color: var(--ok); }
#status.bad { color: var(--bad); }
#status.edited { color: var(--warn); }

main {
  flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1.35fr 1.25fr;
  gap: 1px; background: var(--border); min-height: 0;
}
.col { display: flex; flex-direction: column; gap: 1px; background: var(--border); min-height: 0; min-width: 0; }
.pane { display: flex; flex-direction: column; background: var(--bg); min-height: 0; min-width: 0; }
.pane.grow { flex: 1 1 auto; }
.pane.half { flex: 1 1 50%; }
.pane > h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  margin: 0; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
}
.pane > h2 .hint { text-transform: none; letter-spacing: 0; margin-left: auto; font-size: 11px; }
textarea, .out, .mono {
  flex: 1 1 auto; margin: 0; border: 0; padding: 10px 12px; resize: none; outline: none;
  font: 12.5px/1.6 var(--mono); background: var(--bg); color: var(--text);
  white-space: pre; overflow: auto; tab-size: 2;
}
.out .segid { color: var(--seg); font-weight: 600; }
.picker { display: none; flex: 0 0 auto; max-height: 50%; overflow: auto;
  border-bottom: 1px solid var(--border); background: var(--panel); padding: 8px 12px; }
.picker.on { display: block; }
.picker .prow { padding: 1px 0; }
.picker .prow label { display: flex; align-items: center; gap: 8px; cursor: pointer;
  min-width: 0; font: 12px/1.6 var(--mono); }
.picker .pid { color: var(--seg); font-weight: 600; flex: 0 0 62px; }
.picker .pcount { color: var(--text); flex: 0 0 74px; }
.picker .ptext { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker .pbar { display: flex; gap: 6px; align-items: center; margin-top: 9px; }
.out .sep { color: var(--sep); }
.out .fld:hover { background: var(--chg-bg); border-radius: 2px; }

/* Position readout. Both message panes answer the same question, so both say
   it the same way: PV1-7[2].1, not "the seventh pipe, second repeat". */
#msgfile { margin-left: 12px; }
#msgpos { color: var(--seg); font-weight: 600; }
.tip {
  position: fixed; z-index: 40; display: none; pointer-events: none;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 5px;
  padding: 4px 8px; font: 11.5px/1.5 var(--mono);
  box-shadow: 0 2px 10px rgba(0,0,0,.28); white-space: nowrap;
}
.tip.on { display: block; }
.tip b { color: var(--seg); font-weight: 600; }
.tip span { color: var(--muted); }
.out .chg { background: var(--chg-bg); color: var(--chg-text); border-radius: 2px; }
.diag { font: 12px/1.6 var(--mono); padding: 10px 12px; white-space: pre-wrap; overflow: auto; flex: 1 1 auto; margin: 0; }
.diag.bad { color: var(--bad); }
.diag.quiet { color: var(--muted); }

/* ---- the ObjectScript workbench ---- */
#tab-script { display: none; flex-direction: column; gap: 6px; min-height: 0; }
#tab-script.on { display: flex; }
.scriptbar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.tiny-in { width: 110px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; font: inherit; }
#scriptsrc { flex: 1 1 60%; min-height: 0; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 8px; font: inherit; white-space: pre; overflow: auto; }
#scriptout { flex: 0 1 40%; min-height: 0; overflow: auto; margin: 0; }

/* ---- tabs ---- */
.tabs { display: flex; gap: 2px; flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 6px; }
.tabs button {
  border: 0; background: transparent; color: var(--muted); border-radius: 0;
  border-bottom: 2px solid transparent; padding: 7px 10px; font-size: 11px;
  text-transform: uppercase; letter-spacing: .07em;
}
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs button.copy { margin-left: auto; border-bottom-color: transparent; }
.tabs button.copy:hover { color: var(--text); }
.tabs button.copy.done { color: var(--ok); }
.tabpane { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
.tabpane.on { display: flex; }

/* ---- spec editor ---- */
#spec { flex: 1 1 auto; overflow: auto; padding: 10px 12px 40px; }
fieldset {
  border: 1px solid var(--border); border-radius: 7px; margin: 0 0 12px; padding: 8px 10px 10px;
}
legend {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
  padding: 0 5px; font-weight: 700;
}
label.f { display: flex; align-items: center; gap: 6px; margin: 0 0 5px; }
label.f > span { flex: 0 0 92px; color: var(--muted); font-size: 11.5px; }
input, select {
  font: 12px var(--mono); padding: 3px 6px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg); color: var(--text); min-width: 0;
}
input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input.grow { flex: 1 1 auto; }
input[type=checkbox] { width: auto; flex: 0 0 auto; }
.row { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; flex-wrap: wrap; }
input.sm { width: 74px; }
input.md { width: 116px; }
.blk { border: 1px solid var(--border); border-radius: 7px; margin-bottom: 9px; }
.blk > .bh {
  display: flex; align-items: center; gap: 5px; padding: 6px 8px;
  background: var(--panel); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0;
  flex-wrap: wrap;
}
.blk > .bb { padding: 7px 8px; }
.fieldrow {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 4px 0; border-top: 1px dotted var(--border);
}
.fieldrow:first-child { border-top: 0; }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.steps { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 11.5px; margin: 2px 0 7px; }
.warn {
  background: var(--warn-bg); color: var(--warn); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 9px; margin: 0 0 10px; font-size: 11.5px;
}
.problems {
  background: var(--warn-bg); color: var(--bad); border-bottom: 1px solid var(--border);
  padding: 7px 12px; font: 12px/1.6 var(--mono); white-space: pre-wrap; flex: 0 0 auto;
}
.problems:empty { display: none; }
@media (max-width: 1200px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>hl7-bench <span>spec editor</span></h1>
  <button id="run" class="primary">Write and run</button>
  <kbd>Ctrl</kbd><kbd>Enter</kbd>
  <button id="reload">Reload from disk</button>
  <button id="savemsg">Save message</button>
  <button id="saveout">Save output</button>
  <button id="savecls">Save class</button>
  <label class="hint" for="autosave" title="Autosave takes a recovery draft under logs/autosave/. It never writes transform.ts and never copies the message pane.">draft every</label>
  <select id="autosave" title="Autosave takes a recovery draft under logs/autosave/. It never writes transform.ts and never copies the message pane.">
    <option value="0">off</option>
    <option value="1">1 min</option>
    <option value="5" selected>5 min</option>
    <option value="15">15 min</option>
  </select>
  <div id="status">loading</div>
</header>

<main>
  <div class="col">
    <section class="pane half">
      <h2>Message in
        <button id="grab" class="tiny" type="button" title="Build spec rows from the segments in this message">Copy segments to spec</button>
        <span class="hint" id="msgpos"></span>
        <span class="hint" id="msgfile"></span>
      </h2>
      <div class="picker" id="picker"></div>
      <textarea id="message" spellcheck="false"></textarea>
    </section>
    <section class="pane half">
      <h2>Diagnostics <span class="hint">stderr from bench.ts</span></h2>
      <pre class="diag quiet" id="diag">Write and run to see output.</pre>
    </section>
  </div>

  <div class="col">
    <section class="pane grow">
      <h2>Spec <span class="hint" id="specfile">transform.ts</span></h2>
      <div class="problems" id="problems"></div>
      <div id="spec"></div>
    </section>
  </div>

  <div class="col">
    <section class="pane grow">
      <div class="tabs" id="tabs">
        <button data-tab="output" class="on">Message out</button>
        <button data-tab="iris">ObjectScript</button>
        <button data-tab="mapping">Mapping</button>
        <button data-tab="inventory">Inventory</button>
        <button data-tab="source">transform.ts</button>
        <button data-tab="script" id="scripttab" hidden>ObjectScript file</button>
        <button id="copytab" class="copy" title="Copy this tab. Ctrl+C does the same when nothing is selected.">copy</button>
      </div>
      <div class="tabpane on" id="tab-output">
        <div class="out" id="output"></div>
      </div>
      <div class="tabpane" id="tab-iris"><pre class="mono" id="iris"></pre></div>
      <div class="tabpane" id="tab-mapping"><pre class="mono" id="mapping"></pre></div>
      <div class="tabpane" id="tab-inventory"><pre class="mono" id="inventory"></pre></div>
      <div class="tabpane" id="tab-source"><pre class="mono" id="source"></pre></div>
      <div class="tabpane" id="tab-script">
        <div class="scriptbar">
          <button id="scriptrun" type="button" title="Compile this into a scratch class in the engine and run the message through it">Run in engine</button>
          <button id="scriptsave" type="button" title="Write this back to the file. A .bak is kept the first time.">Save class</button>
          <button id="scriptimport" type="button" title="Read this class into the spec form. Replaces the spec; a .bak is kept.">Import into spec</button>
          <button id="scriptfromspec" type="button" title="Regenerate the class from the spec, into this box. Does not save until you press Save class.">Class from spec</button>
          <label class="hint" for="scriptmethod">method</label>
          <input id="scriptmethod" class="tiny-in" placeholder="OnRequest" spellcheck="false">
          <span class="hint" id="scriptwhere"></span>
        </div>
        <textarea id="scriptsrc" spellcheck="false" placeholder="Start the GUI with --script My.cls to load a class here."></textarea>
        <pre class="mono" id="scriptout"></pre>
      </div>
    </section>
  </div>
</main>

<div id="tip" class="tip"></div>

<script type="module">
import { Message } from "./hl7.js";

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// The vocabulary, as forms
// ---------------------------------------------------------------------------
//
// One entry per kind in spec.ts. The dropdown itself is built from the kind
// list the server sends, NOT from these keys, so a kind added to spec.ts and
// forgotten here shows up in the page as a visible gap rather than as an option
// that silently does nothing. Same reason `todo()` exists in the vocabulary.

const SOURCE_FORM = {
  copy:       [{ k: "path", ph: "PID-3", w: "md" }],
  literal:    [{ k: "value", ph: "constant", w: "md" }],
  firstOf:    [{ k: "paths", ph: "PID-4, PID-3", list: true, w: "grow" }],
  lookup:     [{ k: "table", ph: "table", w: "md" }, { k: "path", ph: "PID-8", w: "sm" }, { k: "unmapped", unmapped: true }],
  counter:    [],
  event:      [],
  pickRepeat: [
    { k: "path", ph: "PV1-7", w: "sm" },
    { k: "whereComponent", ph: "13", num: true, w: "sm" },
    { k: "equals", ph: "NPI", w: "sm" },
    { k: "take", ph: "whole | 1 | 1,2,3", take: true, w: "md" },
  ],
  fromFirst:  [{ k: "segment", ph: "NK1", w: "sm" }, { k: "nonEmpty", ph: "NK1-2", w: "sm" }, { k: "path", ph: "NK1-2", w: "sm" }],
  todo:       [{ k: "why", ph: "why this is not expressible yet", w: "grow" }],
};

const SOURCE_DEFAULT = {
  copy: () => ({ kind: "copy", path: "" }),
  literal: () => ({ kind: "literal", value: "" }),
  firstOf: () => ({ kind: "firstOf", paths: [] }),
  lookup: () => ({ kind: "lookup", table: "", path: "", unmapped: { kind: "blank" } }),
  counter: () => ({ kind: "counter" }),
  event: () => ({ kind: "event" }),
  pickRepeat: () => ({ kind: "pickRepeat", path: "", whereComponent: 1, equals: "", take: "whole" }),
  fromFirst: () => ({ kind: "fromFirst", segment: "", nonEmpty: "", path: "" }),
  todo: () => ({ kind: "todo", why: "" }),
};

const STEP_FORM = {
  date8: [], upper: [], stripDelims: [],
  truncate: [{ k: "n", ph: "8", num: true, w: "sm" }],
  stripChars: [{ k: "chars", ph: "- ", w: "sm" }],
  defaultTo: [{ k: "value", ph: "U", w: "sm" }],
  prefix: [{ k: "text", ph: "ADT^", w: "sm" }],
};

const STEP_DEFAULT = {
  date8: () => ({ kind: "date8" }),
  upper: () => ({ kind: "upper" }),
  stripDelims: () => ({ kind: "stripDelims" }),
  truncate: () => ({ kind: "truncate", n: 8 }),
  stripChars: () => ({ kind: "stripChars", chars: "" }),
  defaultTo: () => ({ kind: "defaultTo", value: "" }),
  prefix: () => ({ kind: "prefix", text: "" }),
};

// A repeat's select and fold. Unlike a source, which every row must have, both
// of these are usually absent -- so their dropdown carries a (none) entry and
// choosing it removes the clause rather than leaving an empty one behind.
const SELECT_FORM = {
  highest: [{ k: "path", ph: "OBX-17", w: "sm", title: "keep only the highest value of this field" }],
  equals: [
    { k: "path", ph: "PV1-2", w: "sm" },
    { k: "value", ph: "IP", w: "sm", title: "keep only occurrences equal to this" },
  ],
};

const SELECT_DEFAULT = {
  highest: () => ({ kind: "highest", path: "" }),
  equals: () => ({ kind: "equals", path: "", value: "" }),
};

const FOLD_FORM = {
  continuation: [
    { k: "path", ph: "OBX-5", w: "sm", title: "the field carrying the wrapped text" },
    { k: "join", ph: "(blank: the leading space is the separator)", w: "md",
      title: "joined between the two values. Blank is almost always right." },
  ],
};

const FOLD_DEFAULT = {
  continuation: () => ({ kind: "continuation", path: "", join: "" }),
};

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

let spec = null;
let sourceKinds = Object.keys(SOURCE_FORM);
let stepKinds = Object.keys(STEP_FORM);
let selectKinds = Object.keys(SELECT_FORM);
let foldKinds = Object.keys(FOLD_FORM);
let messageFile = "sample.hl7";
let defaultOut = "messages/output.hl7";
let lastOutput = "";
let lastIris = "";
let dirty = false;

// ---------------------------------------------------------------------------
// Autosave
//
// The timer takes a DRAFT. It does not save. That distinction is the whole
// design: Ctrl+Enter stays the only thing that writes transform.ts, so it stays
// the only thing that spends the one transform.ts.bak of the session and the
// only thing that changes what PipeHat picks up. A draft is a copy parked under
// logs/autosave/ that the page offers back on the next load if it outlived
// transform.ts. See draft.ts for the full argument.
//
// The interval lives in localStorage rather than on the server, because it is a
// property of how you work and not of the interface you are describing. Two
// people on two machines editing the same transform.ts should not be arguing
// over each other's timer.
// ---------------------------------------------------------------------------

const AUTOSAVE_KEY = "hl7-bench.autosave.minutes";
let autosaveTimer = null;

function setStatus(text, kind) {
  $("status").textContent = text;
  $("status").className = kind ?? "";
}

function markEdited() {
  dirty = true;
  setStatus("edited, not written. Ctrl+Enter writes transform.ts and runs it", "edited");
}

// ---------------------------------------------------------------------------
// Small DOM helpers
// ---------------------------------------------------------------------------

function el(tag, attrs = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of [].concat(kids)) if (kid) n.appendChild(kid);
  return n;
}

/**
 * A text box wired straight to a property of an object in the spec.
 *
 * Typing mutates the model and schedules a preview; it never re-renders, or the
 * caret would jump to the end of the box on every keystroke. Only structural
 * edits (add, delete, reorder, change of kind) rebuild the form.
 */
function text(obj, key, opts = {}) {
  const input = el("input", {
    class: opts.w ?? "",
    placeholder: opts.ph ?? "",
    value: opts.get ? opts.get(obj) : (obj[key] ?? ""),
    title: opts.title ?? opts.ph ?? String(key),
  });
  input.addEventListener("input", () => {
    if (opts.set) opts.set(obj, input.value);
    else if (opts.num) obj[key] = Number(input.value) || 0;
    else if (input.value === "" && opts.optional) delete obj[key];
    else obj[key] = input.value;
    markEdited();
    schedulePreview();
  });
  return input;
}

function check(obj, key, label) {
  const box = el("input", { type: "checkbox" });
  box.checked = !!obj[key];
  box.addEventListener("change", () => {
    if (box.checked) obj[key] = true;
    else delete obj[key];
    markEdited();
    schedulePreview();
  });
  return el("label", { class: "f", style: "flex:0 0 auto;margin:0" }, [
    box, el("span", { text: label, style: "flex:0 0 auto" }),
  ]);
}

function select(value, options, onchange, cls) {
  const s = el("select", { class: cls ?? "" });
  for (const o of options) {
    const opt = el("option", { value: o, text: o });
    if (o === value) opt.selected = true;
    s.appendChild(opt);
  }
  // An unknown kind keeps an option of its own rather than snapping to the
  // first entry, which would edit the spec merely by rendering it.
  if (!options.includes(value)) {
    const opt = el("option", { value, text: `${value} (no form)` });
    opt.selected = true;
    s.appendChild(opt);
  }
  s.addEventListener("change", () => onchange(s.value));
  return s;
}

const btn = (label, title, fn) =>
  el("button", { class: "tiny", type: "button", title, text: label, onclick: fn });

// ---------------------------------------------------------------------------
// Source and step editors
// ---------------------------------------------------------------------------

function parseTake(v) {
  const t = v.trim();
  if (t === "" || /^whole$/i.test(t)) return "whole";
  if (t.includes(",")) return t.split(",").map((n) => Number(n.trim())).filter((n) => n > 0);
  const n = Number(t);
  return n > 0 ? n : "whole";
}
const showTake = (t) => (t === "whole" ? "whole" : Array.isArray(t) ? t.join(",") : String(t));

function unmappedEditor(from) {
  const kinds = ["blank", "passthrough", "constant"];
  const wrap = el("span", { class: "steps" });
  const draw = () => {
    wrap.replaceChildren();
    wrap.appendChild(el("span", { class: "tag", text: "unmapped" }));
    wrap.appendChild(select(from.unmapped.kind, kinds, (k) => {
      from.unmapped = k === "constant" ? { kind: "constant", value: "" } : { kind: k };
      markEdited();
      draw();
      schedulePreview();
    }));
    if (from.unmapped.kind === "constant") {
      wrap.appendChild(text(from.unmapped, "value", { ph: "value", w: "sm" }));
    }
  };
  draw();
  return wrap;
}

/**
 * The custom schema category, if this interface needs one.
 *
 * Metadata is editable. The DEFINITION is shown but not meant to be typed here:
 * it is the stock structure with the feed's departures applied, and the way to
 * get one is
 *
 *     bun schema-sync.ts --derive DFT_P03 --base 2.5
 *
 * which reads it off the instance you are targeting. Typing one by hand into a
 * text box produces a definition nobody can diff against stock, and the diff
 * against stock is the thing you have to defend to whoever owns the interface.
 */
function schemaEditor(redraw) {
  const box = el("fieldset", {}, [el("legend", { text: "Custom HL7 schema" })]);
  const sch = spec.iris.schema;

  if (!sch) {

  box.appendChild(el("div", { class: "note", text: "A DEPENDENCY of this transform. Emit with `bun emit.ts schema`, load with `bun schema-sync.ts --import`, and confirm the engine still matches with `bun schema-sync.ts`. A category that exists but is STALE passes navcheck: the message navigates, under the wrong definition." }));

      text(st, "name", { w: "sm", ph: "DFT_P03" }),

      }),
    ]));
    box.appendChild(el("label", { class: "f" }, [
      el("span", { text: "definition" }),
      text(st, "definition", { w: "grow", ph: "bun schema-sync.ts --derive " + (st.name || "DFT_P03") }),
    ]));

      el("span", { text: "note" }),
      text(st, "note", { w: "grow", optional: true, ph: "what changed from stock, and what in the feed forced it" }),

  box.appendChild(btn("Add structure", "another message structure in this category", () => {
    sch.structures.push({ name: "", definition: "" });
    markEdited(); redraw(); schedulePreview();
  }));
  box.appendChild(btn("x remove the category", "this spec stops depending on a custom schema", () => {
    delete spec.iris.schema; markEdited(); redraw(); schedulePreview();
  }));

}

const NO_CLAUSE = "(none)";

/**
 * The select or fold clause of a repeat, or nothing at all.
 *
 * Optional in a way a row's `from` is not, so the kind list gets a (none) entry
 * and picking it deletes the clause. Leaving an empty one behind would serialize
 * a call with blank arguments into transform.ts, which validate() then rejects
 * on a field the author never meant to add.
 *
 * Kinds come from the server, same as sources and steps, so a kind added to
 * spec.ts shows up here the moment it exists and an unknown one says so rather
 * than rendering as a finished field.
 */
function clauseEditor(holder, prop, kinds, FORM, DEFAULT, redraw) {
  const wrap = el("span", { class: "steps" });
  wrap.appendChild(select(holder[prop]?.kind ?? NO_CLAUSE, [NO_CLAUSE, ...kinds], (k) => {
    if (k === NO_CLAUSE) delete holder[prop];
    else holder[prop] = (DEFAULT[k] ?? (() => ({ kind: k })))();
    markEdited();
    redraw();
    schedulePreview();
  }));

  const clause = holder[prop];
  if (!clause) return wrap;

  const form = FORM[clause.kind];
  if (!form) {
    wrap.appendChild(el("span", {
      class: "tag",
      style: "color:var(--bad)",
      text: `no form for "${clause.kind}", edit transform.ts by hand`,
    }));
    return wrap;
  }
  for (const f of form) wrap.appendChild(text(clause, f.k, f));
  return wrap;
}

/** Inputs for one source, rebuilt whenever its kind changes. */
function sourceEditor(row, redraw) {
  const wrap = el("span", { class: "steps" });
  wrap.appendChild(select(row.from.kind, sourceKinds, (k) => {
    row.from = (SOURCE_DEFAULT[k] ?? (() => ({ kind: k })))();
    markEdited();
    redraw();
    schedulePreview();
  }));

  const form = SOURCE_FORM[row.from.kind];
  if (!form) {
    // A kind spec.ts knows and this page does not. Said out loud rather than
    // rendered as an empty cell that looks like a finished field.
    wrap.appendChild(el("span", {
      class: "tag",
      style: "color:var(--bad)",
      text: `no form for "${row.from.kind}", edit transform.ts by hand`,
    }));
    return wrap;
  }

  for (const f of form) {
    if (f.unmapped) { wrap.appendChild(unmappedEditor(row.from)); continue; }
    if (f.list) {
      wrap.appendChild(text(row.from, f.k, {
        ph: f.ph, w: f.w,
        get: (o) => (o[f.k] ?? []).join(", "),
        set: (o, v) => { o[f.k] = v.split(",").map((s) => s.trim()).filter(Boolean); },
      }));
      continue;
    }
    if (f.take) {
      wrap.appendChild(text(row.from, f.k, {
        ph: f.ph, w: f.w,
        get: (o) => showTake(o[f.k]),
        set: (o, v) => { o[f.k] = parseTake(v); },
      }));
      continue;
    }
    wrap.appendChild(text(row.from, f.k, f));
  }
  return wrap;
}

function stepsEditor(row, redraw) {
  const wrap = el("span", { class: "steps" });
  wrap.appendChild(el("span", { class: "tag", text: "via" }));
  (row.via ?? []).forEach((step, i) => {
    wrap.appendChild(select(step.kind, stepKinds, (k) => {
      row.via[i] = (STEP_DEFAULT[k] ?? (() => ({ kind: k })))();
      markEdited(); redraw(); schedulePreview();
    }));
    for (const f of STEP_FORM[step.kind] ?? []) wrap.appendChild(text(step, f.k, f));
    wrap.appendChild(btn("x", "remove this step", () => {
      row.via.splice(i, 1);
      if (row.via.length === 0) delete row.via;
      markEdited(); redraw(); schedulePreview();
    }));

  wrap.appendChild(btn("+ step", "add a step that runs after the source resolves", () => {

  }));
  return wrap;
}

function pairList(obj, keyPh, valPh, redraw) {
  const wrap = el("div");
  for (const k of Object.keys(obj)) {
    const kInput = el("input", { class: "md", value: k, placeholder: keyPh });
    // Renaming a key rebuilds the object so insertion order, and therefore the
    // order in the generated file, follows what is on screen.
    kInput.addEventListener("change", () => {
      const next = {};
      for (const old of Object.keys(obj)) next[old === k ? kInput.value : old] = obj[old];
      for (const old of Object.keys(obj)) delete obj[old];
      Object.assign(obj, next);
      markEdited(); redraw(); schedulePreview();
    });
    wrap.appendChild(el("div", { class: "row" }, [
      kInput,
      el("span", { class: "tag", text: "becomes" }),
      text(obj, k, { ph: valPh, w: "md" }),
      btn("x", "remove", () => { delete obj[k]; markEdited(); redraw(); schedulePreview(); }),
    ]));

  wrap.appendChild(btn("+ row", "add a pair", () => {
    obj[""] = "";
    markEdited(); redraw(); schedulePreview();
  }));
  return wrap;
}

// ---------------------------------------------------------------------------
// The message diff
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Where am I in this message
//
// Counting pipes by eye is how a mapping ends up one field off, and the MSH
// line makes it worse: MSH-1 IS the field separator and MSH-2 IS the encoding
// characters, so everything after the segment id on an MSH sits one slot left
// of where a naive split puts it. Both message panes answer the question the
// same way, in the same notation the spec uses, so a readout can be typed
// straight into a row.
// ---------------------------------------------------------------------------

/** Delimiters from the same parser bench.ts uses, with the standard fallback. */
function delimsOf(raw) {
  try {
    return new Message(raw).delims;
  } catch {
    return { field: "|", comp: "^", rep: "~", esc: "\\", sub: "&" };
  }
}

/**
 * Which occurrence of its own segment id each line is, and how many there are.
 * Blank lines keep their slot, so a line index stays a line index.
 */
function occurrences(lines, fieldDelim) {
  const total = new Map();
  const out = lines.map((line) => {
    if (line.trim() === "") return null;
    const id = line.split(fieldDelim)[0];
    const n = (total.get(id) ?? 0) + 1;
    total.set(id, n);
    return { id, occ: n };
  });
  for (const o of out) if (o) o.total = total.get(o.id);
  return out;
}

/**
 * Which slice of `raw` the offset lands in, given a one character delimiter.
 * With no offset it is slice 0, which is what the output pane wants: the
 * label describes the field, not a point inside it.
 */
function sliceAt(raw, delim, offset) {
  const parts = raw.split(delim);
  if (offset === undefined) return { index: 0, parts };
  let seen = 0;
  for (let i = 0; i < parts.length; i++) {
    const end = seen + parts[i].length;
    if (offset <= end) return { index: i, parts, before: seen };
    seen = end + 1;
  }
  return { index: parts.length - 1, parts, before: seen };
}

/**
 * The HL7 path for a raw split index on a line, e.g. "PV1-7[2].1".
 *
 * `fieldIndex` is the split index, so 0 is the segment id. Repetition and
 * component are shown only when the field actually has them: a path carrying
 * indexes that are always 1 is noise in the one place noise gets copied
 * straight into a spec.
 */
/**
 * A field's pieces, each with the character offset it starts at INSIDE the
 * field, plus the separators between them.
 *
 * The offset is the whole point. `hl7Path` already knows how to turn a position
 * inside a field into "MSH-9.3" -- it was only ever called with `undefined`, so
 * the pane could name a field and never a component. Handing each piece its own
 * offset lets the existing path logic label it, rather than a second
 * implementation of the same arithmetic drifting from the first.
 *
 * Repetition first, then components within each repetition, which is the order
 * `hl7Path` unwinds them in.
 */
function leavesOf(value, delims) {
  const out = [];
  let off = 0;
  value.split(delims.rep).forEach((rep, ri) => {
    if (ri > 0) { out.push({ sep: delims.rep }); off += 1; }
    rep.split(delims.comp).forEach((comp, ci) => {
      if (ci > 0) { out.push({ sep: delims.comp }); off += 1; }
      out.push({ text: comp, offset: off });
      off += comp.length;
    });
  });
  return out;
}

function hl7Path(line, delims, fieldIndex, charInField) {
  const parts = line.split(delims.field);
  const id = parts[0];
  if (fieldIndex <= 0) return id;

  // MSH-1 is the separator itself, so the id occupies the slot MSH-1 would
  // take and every later field shifts by one. MSH-2 is never split further:
  // it is the field that DEFINES the delimiters, and splitting it returns "^".
  const isMsh = id === "MSH";
  const num = isMsh ? fieldIndex + 1 : fieldIndex;
  if (isMsh && num <= 2) return id + "-" + num;

  let path = id + "-" + num;
  let rest = parts[fieldIndex] ?? "";
  let offset = charInField;

  const rep = sliceAt(rest, delims.rep, offset);
  if (rep.parts.length > 1) {
    path += "[" + (rep.index + 1) + "]";
    rest = rep.parts[rep.index];
    offset = offset === undefined ? undefined : offset - (rep.before ?? 0);
  }

  const comp = sliceAt(rest, delims.comp, offset);
  if (comp.parts.length > 1) path += "." + (comp.index + 1);

  return path;
}

/** "PID-5.1 \u00b7 PID #1 of 1 \u00b7 line 3", or "" when there is no segment there. */
function positionLabel(raw, lineIndex, fieldIndex, charInField) {
  const lines = raw.split(/\r\n|\r|\n/);
  const line = lines[lineIndex];
  if (line === undefined || line.trim() === "") return "";

  const delims = delimsOf(raw);
  const occ = occurrences(lines, delims.field)[lineIndex];
  const path = hl7Path(line, delims, fieldIndex, charInField);
  const which = occ.total > 1 ? occ.id + " #" + occ.occ + " of " + occ.total : occ.id;
  return path + " \u00b7 " + which + " \u00b7 line " + (lineIndex + 1);
}

// ---- the textarea: read the caret ------------------------------------------

function caretPosition() {
  const ta = $("message");
  const raw = ta.value;
  const at = ta.selectionStart ?? 0;

  // A textarea normalises line endings to LF in .value, so the separator is
  // always one character and these offsets line up with the split.
  const before = raw.slice(0, at);
  const lineIndex = (before.match(/\n/g) ?? []).length;
  const col = at - (before.lastIndexOf("\n") + 1);

  const line = raw.split(/\r\n|\r|\n/)[lineIndex] ?? "";
  const upto = line.slice(0, col).split(delimsOf(raw).field);
  return positionLabel(raw, lineIndex, upto.length - 1, upto[upto.length - 1].length);
}

function showCaretPosition() {
  $("msgpos").textContent = caretPosition();
}

for (const ev of ["click", "keyup", "input", "select", "focus"]) {
  $("message").addEventListener(ev, showCaretPosition);
}
$("message").addEventListener("blur", () => { $("msgpos").textContent = ""; });

// ---- the output pane: hover a field ----------------------------------------

const tip = $("tip");

$("output").addEventListener("mousemove", (e) => {
  const fld = e.target.closest ? e.target.closest(".fld") : null;
  if (!fld) { tip.classList.remove("on"); return; }

  const [path, ...rest] = (fld.dataset.pos ?? "").split(" \u00b7 ");
  tip.replaceChildren(
    el("b", { text: path }),
    el("span", { text: rest.length ? " \u00b7 " + rest.join(" \u00b7 ") : "" }),
  );
  tip.classList.add("on");

  // Flip to the left of the cursor near the right edge, so the tooltip never
  // pushes the window into a horizontal scroll.
  const w = tip.offsetWidth;
  const x = e.clientX + 14 + w > window.innerWidth ? e.clientX - w - 14 : e.clientX + 14;
  tip.style.left = Math.max(4, x) + "px";
  tip.style.top = (e.clientY + 18) + "px";
});

$("output").addEventListener("mouseleave", () => tip.classList.remove("on"));

// ---------------------------------------------------------------------------

// Field-level diff. Delimiters come from the same parser bench.ts uses, then
// segments are compared by (id, occurrence) and fields by raw split index,
// which sidesteps the MSH off-by-one entirely: both sides of the comparison are
// the same segment and shift identically.
function indexSegments(raw, delims) {
  const map = new Map();
  const seen = new Map();
  for (const line of raw.split(/\r\n|\r|\n/)) {
    if (line.trim() === "") continue;
    const parts = line.split(delims.field);
    const id = parts[0];
    const occ = (seen.get(id) ?? 0) + 1;
    seen.set(id, occ);
    map.set(id + "#" + occ, parts);
  }
  return map;
}

function renderDiff(before, after) {
  const delims = delimsOf(after);

  let beforeMap = new Map();
  try { beforeMap = indexSegments(before, delims); } catch { /* no baseline, show plain */ }

  const seen = new Map();
  const frag = document.createDocumentFragment();
  let changed = 0;

  const lines = after.split(/\r\n|\r|\n/);
  // Once for the message, not once per field: positionLabel would re-split the
  // whole message for every span, which on a fat ADT is a few hundred passes.
  const occs = occurrences(lines, delims.field);
  lines.forEach((line, lineIndex) => {
    if (line.trim() === "") return;
    const parts = line.split(delims.field);
    const id = parts[0];
    const occ = (seen.get(id) ?? 0) + 1;
    seen.set(id, occ);
    const old = beforeMap.get(id + "#" + occ);
    const o = occs[lineIndex];
    const where =
      " · " +
      (o.total > 1 ? id + " #" + o.occ + " of " + o.total : id) +
      " · line " +
      (lineIndex + 1);

    const row = document.createElement("div");
    parts.forEach((value, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = delims.field;
        row.appendChild(sep);
      }
      const span = document.createElement("span");
      span.className = i === 0 ? "fld segid" : "fld";
      if (i > 0 && old && (old[i] ?? "") !== value) { span.classList.add("chg"); changed++; }
      // Stamped here rather than computed on hover: the indexes are already
      // in hand, and a mousemove handler that reparses the message per pixel
      // is the kind of thing that makes a pane feel broken.
      span.dataset.pos = hl7Path(line, delims, i, undefined) + where;

      // Components get their own spans, so hovering "ADT_A01" in
      // "ADT^A28^ADT_A01" says MSH-9.3 rather than MSH-9. The field span stays
      // and keeps carrying the field-level path, so the separators between the
      // pieces -- and a field with nothing to split -- answer as they did.
      //
      // MSH-1 and MSH-2 are never split: MSH-1 is the field separator and has
      // no slot, and MSH-2 is the field that DEFINES the delimiters, so
      // splitting it by them returns "^". `hl7Path` refuses the same two.
      const isMsh = id === "MSH";
      const num = isMsh ? i + 1 : i;
      const splittable = i > 0 && !(isMsh && num <= 2);
      const leaves = splittable ? leavesOf(value, delims) : [];

      if (leaves.filter((l) => l.text !== undefined).length > 1) {
        for (const leaf of leaves) {
          if (leaf.sep !== undefined) {
            const s = document.createElement("span");
            s.className = "sep";
            s.textContent = leaf.sep;
            span.appendChild(s);
            continue;
          }
          const c = document.createElement("span");
          c.className = "fld";
          c.dataset.pos = hl7Path(line, delims, i, leaf.offset) + where;
          c.textContent = leaf.text;
          span.appendChild(c);
        }
      } else {
        span.textContent = value;
      }
      row.appendChild(span);
    });
    frag.appendChild(row);
  });

  $("output").replaceChildren(frag);
  return changed;
}

// ---------------------------------------------------------------------------
// Talking to the server
// ---------------------------------------------------------------------------

function showProblems(problems) {
  const host = $("problems");
  if (!problems || problems.length === 0) { host.textContent = ""; return; }
  host.textContent =
    `${problems.length} problem${problems.length === 1 ? "" : "s"}. Nothing is written to disk until these are fixed:\n` +
    problems.map((p) => `  - ${p}`).join("\n");
}

function showDerived(res) {
  if (res.iris !== undefined) {
    lastIris = res.iris;
    const empties = (res.emptyTables ?? []).length
      ? `\n\nEMPTY LOOKUP TABLES (${res.emptyTables.length}), each one a go-live gate:\n` +
        res.emptyTables.map((n) => `  - ${n}: returns the unmapped branch for EVERY message`).join("\n")
      : "";
    $("iris").textContent =
      `ROUTING RULE CONDITION\n  ${res.routing}\n\n${"-".repeat(64)}\n\n${res.iris}${empties}`;
  }
  if (res.trace !== undefined) $("mapping").textContent = res.trace;
  if (res.inventory !== undefined) $("inventory").textContent = res.inventory || "(this spec has no sourceInventory)";
  if (res.source !== undefined) $("source").textContent = res.source;
}

let previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(preview, 250);
}

/**
 * Re-render everything that is a pure function of the spec. Touches no file and
 * runs no subprocess, which is why it is safe to fire while you type.
 */
async function preview() {
  if (!spec) return;
  try {
    const r = await fetch("/preview", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec, message: $("message").value }),
    });
    const res = await r.json();
    if (res.error) { setStatus(res.error, "bad"); return; }
    showProblems(res.problems);
    showDerived(res);
  } catch {
    setStatus("server unreachable", "bad");
  }
}

async function run() {
  if (!spec) return;
  $("run").disabled = true;
  setStatus("running...");
  try {
    const r = await fetch("/run", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec, message: $("message").value }),
    });
    const res = await r.json();

    if (res.error) {
      lastOutput = "";
      $("diag").textContent = res.error;
      $("diag").className = "diag bad";
      setStatus("failed", "bad");
      return;
    }

    showProblems(res.problems);
    showDerived(res);

    if (!res.saved) {
      lastOutput = "";
      $("output").replaceChildren();
      $("diag").textContent = "The spec does not validate, so transform.ts was left alone. The problems are listed above the form.";
      $("diag").className = "diag bad";
      setStatus(`${res.problems.length} problem(s), nothing written`, "bad");
      return;
    }

    dirty = false;

    // transform.ts now holds what is on screen, so the draft has nothing left
    // to recover. The server clears it too; this is the page not waiting for
    // the next load to find out.
    dropDraft();

    if (res.exitCode !== 0) {
      lastOutput = "";
      $("output").replaceChildren();
      $("diag").textContent = res.stderr.trim() || "(the transform failed but wrote nothing to stderr)";
      $("diag").className = "diag bad";
      setStatus(`exit ${res.exitCode}`, "bad");
      return;
    }

    lastOutput = res.stdout;
    const changed = renderDiff($("message").value, res.stdout);
    $("diag").textContent = res.stderr.trim() || "(no diagnostics)";
    $("diag").className = "diag quiet";
    setStatus(`ok, ${changed} field${changed === 1 ? "" : "s"} changed, ${res.ms} ms`, "ok");
  } catch (e) {
    lastOutput = "";
    $("diag").textContent = String(e);
    $("diag").className = "diag bad";
    setStatus("server unreachable", "bad");
  } finally {
    $("run").disabled = false;
  }
}

/** Minutes from the picker, or 0 for off. Anything unrecognised falls back to 5. */
function autosaveMinutes() {
  const n = Number($("autosave").value);
  return Number.isFinite(n) && n >= 0 ? n : 5;
}

/**
 * Take one draft now, if there is anything worth taking.
 *
 * Skipped when nothing has been edited. Re-writing an identical draft on a
 * timer would churn the disk for no reason, and worse, it would keep pushing
 * the draft's timestamp forward past a real save, which is the one thing the
 * staleness rule in draft.ts relies on to know it can stop offering it.
 */
async function takeDraft(reason) {
  if (!spec || !dirty) return false;
  try {
    const res = await (await fetch("/draft", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec }),
    })).json();
    if (res.error) { setStatus(res.error, "bad"); return false; }

    // Deliberately not the "ok" green, and it still says what is NOT done. A
    // green "saved 14:35" here would be a lie that costs somebody an afternoon,
    // because the file the CLI reads has not moved.
    const at = new Date(res.savedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    setStatus(`draft ${at} (${reason}), not written. Ctrl+Enter writes transform.ts`, "edited");
    return true;
  } catch {
    return false;
  }
}

/** Restart the timer on the current setting. Called on load and on every change. */
function armAutosave() {
  if (autosaveTimer) clearInterval(autosaveTimer);
  autosaveTimer = null;
  const mins = autosaveMinutes();
  if (mins > 0) autosaveTimer = setInterval(() => takeDraft("autosave"), mins * 60000);
}

function dropDraft() {
  return fetch("/draft/discard", { method: "POST" }).catch(() => {});
}

/**
 * Offer a recovered draft, once, on load. Returns the spec to use, or null.
 *
 * The server has already thrown away any draft older than transform.ts, so
 * anything that arrives here genuinely outlived the file. Declining discards it
 * rather than leaving it to ask again on every reload.
 */
async function offerDraft(draft) {
  if (!draft || !draft.spec) return null;
  const at = new Date(draft.savedAt).toLocaleString();
  const ok = confirm(
    `An unsaved draft of "${draft.specName}" from ${at} is newer than transform.ts.\n\n` +
    "Recover it into the editor? Nothing is written until you press Ctrl+Enter.\n\n" +
    "Cancel throws the draft away and loads transform.ts as it stands.",
  );
  if (!ok) { await dropDraft(); return null; }
  return draft.spec;
}

async function load() {
  const res = await (await fetch("/state")).json();
  $("message").value = res.message;
  messageFile = res.messageFile ?? messageFile;
  defaultOut = res.defaultOut ?? defaultOut;
  sourceKinds = res.sourceKinds ?? sourceKinds;
  stepKinds = res.stepKinds ?? stepKinds;
  selectKinds = res.selectKinds ?? selectKinds;
  foldKinds = res.foldKinds ?? foldKinds;
  $("msgfile").textContent = messageFile;
  $("specfile").textContent = res.transformFile ?? "transform.ts";
  lastOutput = "";
  $("output").replaceChildren();
  $("diag").textContent = "Write and run to see output.";
  $("diag").className = "diag quiet";

  // Offered BEFORE the specError branch on purpose. A transform.ts that will
  // not import is the case where a draft is not a convenience but the only
  // surviving copy, and returning early would have hidden it.
  const recovered = await offerDraft(res.draft);

  if (res.specError && !recovered) {
    spec = null;
    $("spec").replaceChildren(el("div", { class: "warn" }, [
      el("div", { text: "transform.ts did not load, so there is no spec to edit. Fix it in an editor and press Reload from disk." }),
      el("pre", { class: "diag bad", style: "padding:8px 0 0", text: res.specError }),
    ]));
    setStatus("transform.ts did not load", "bad");
    armAutosave();
    return;
  }

  spec = recovered ?? res.spec;

  // A recovered draft is unsaved work by definition, so the page opens dirty.
  // Marking it clean would let "Reload from disk" discard it without the
  // confirm, one click after you chose to keep it.
  dirty = !!recovered;

  renderSpec();
  if (recovered) setStatus("recovered draft, not written. Ctrl+Enter writes transform.ts", "edited");
  else setStatus(`loaded ${messageFile}`);
  await preview();
  armAutosave();
}

// ---------------------------------------------------------------------------
// Copy segments out of the message and into the spec
//
// Typing a row per field for a segment that mostly passes straight through is
// the slowest part of describing an interface, and it is the part with nothing
// to think about. This reads the message on the left, and for every segment you
// tick it writes one copy() row per populated field.
//
// What comes out is a starting point, not an answer. Every row lands as a
// straight copy. The fields that need a lookup, a firstOf, a literal or a date
// step are yours to change, and the ones the receiver does not want are yours
// to delete. Nothing is written to disk until Ctrl+Enter.
// ---------------------------------------------------------------------------

/**
 * MSH-1 is the field separator and MSH-2 is the encoding characters. Neither is
 * a value you map. MSH-1 cannot be assigned at all, and MSH-2 is written by
 * whatever emits the message, so a copy() row for either one is a row that
 * throws or a row that lies. The picker never offers them.
 */
const NOT_COPYABLE = { MSH: [1, 2] };

/**
 * Field numbers carrying something in ANY occurrence of this segment.
 *
 * Reading only the first occurrence is the obvious version and it is wrong.
 * The first NK1 on a message often carries three fields and the second carries
 * ten, so the first one alone would quietly decide that seven fields the sender
 * populates do not exist. Union across every occurrence instead, then let the
 * empty ones be deleted by hand.
 */
function copyableFields(segs) {
  const list = [].concat(segs);
  const skip = NOT_COPYABLE[list[0].id] ?? [];
  const out = new Set();
  for (const seg of list) {
    for (let f = 1; f <= seg.fieldCount; f++) {
      if (skip.includes(f)) continue;
      if (seg.getField(f) === "") continue;
      out.add(f);
    }
  }
  return [...out].sort((a, b) => a - b);
}

const existingBlock = (id) => spec.blocks.find((b) => b.id === id);

function renderPicker() {
  const host = $("picker");
  host.textContent = "";

  let msg;
  try {
    msg = new Message($("message").value);
  } catch (err) {
    host.appendChild(el("div", { class: "note", text: `Cannot read this message: ${err.message}` }));
    host.appendChild(el("div", { class: "pbar" }, [btn("close", "hide this list", () => togglePicker(false))]));
    return;
  }

  host.appendChild(el("div", { class: "note", text: "Every field below arrives as a straight copy. MSH-9 and MSH-10 usually want event() and the control id rather than a copy, and any coded field usually wants a lookup, so treat this as the first draft of the segment." }));

  // One row per segment id, not per occurrence. A block for NK1 already covers
  // every NK1 on the wire, so listing three of them would only invite three
  // identical blocks.
  const seen = new Map();
  for (const s of msg.segments) {
    if (!seen.has(s.id)) seen.set(s.id, { id: s.id, segs: [] });
    seen.get(s.id).segs.push(s);
  }

  const boxes = [];
  for (const info of seen.values()) {
    info.count = info.segs.length;
    info.first = info.segs[0];
    const fields = copyableFields(info.segs);
    const already = !!existingBlock(info.id);

    const box = el("input", { type: "checkbox" });
    // Default the tick to the segments you do not have yet, because that is the
    // usual reason to open this at all.
    box.checked = !already && fields.length > 0;
    box.dataset.id = info.id;
    boxes.push(box);

    const count = `${fields.length} field${fields.length === 1 ? "" : "s"}`;
    const tail = info.count > 1 ? ` x${info.count}` : "";
    const note = already ? "  [in the spec already]" : "";

    host.appendChild(el("div", { class: "prow" }, [
      el("label", {}, [
        box,
        el("span", { class: "pid", text: info.id + tail }),
        el("span", { class: "pcount", text: count }),
        el("span", { class: "ptext", text: info.first.toString() + note }),
      ]),
    ]));
  }

  host.appendChild(el("div", { class: "pbar" }, [
    btn("all", "tick every segment", () => boxes.forEach((b) => { b.checked = true; })),
    btn("none", "clear the selection", () => boxes.forEach((b) => { b.checked = false; })),
    btn("Add to spec", "build a segment block per ticked line", () => {
      addSegments(msg, boxes.filter((b) => b.checked).map((b) => b.dataset.id));
    }),
    btn("close", "hide this list", () => togglePicker(false)),
  ]));
}

/**
 * Build a block per selected segment id, one copy() row per populated field.
 *
 * Rows that are already in the block are left alone, so running this a second
 * time after the message grows a field adds only the new one and never
 * disturbs the mapping you have already corrected by hand.
 */
function addSegments(msg, ids) {
  if (ids.length === 0) {
    setStatus("nothing ticked", "edited");
    return;
  }

  let added = 0;
  let skipped = 0;
  let newBlocks = 0;

  for (const id of ids) {
    const occurrences = msg.all(id);
    if (occurrences.length === 0) continue;

    let block = existingBlock(id);
    if (!block) {
      block = { id, rows: [] };
      // More than one on the wire means the spec has to say so, or only the
      // first one is ever delivered.
      if (occurrences.length > 1) block.repeat = { over: id };
      spec.blocks.push(block);
      newBlocks++;
    }

    const have = new Set(block.rows.map((r) => r.target));
    for (const f of copyableFields(occurrences)) {
      const target = `${id}-${f}`;
      if (have.has(target)) {
        skipped++;
        continue;
      }
      const from = SOURCE_DEFAULT.copy();
      from.path = target;
      block.rows.push({ target, from });
      have.add(target);
      added++;
    }
  }

  markEdited();
  renderSpec();
  schedulePreview();
  togglePicker(false);

  const bits = [`${added} field${added === 1 ? "" : "s"} added`];
  if (newBlocks) bits.push(`${newBlocks} new segment${newBlocks === 1 ? "" : "s"}`);
  if (skipped) bits.push(`${skipped} already mapped`);
  setStatus(`${bits.join(", ")}. All copies. Ctrl+Enter writes transform.ts`, "edited");
}

function togglePicker(on) {
  const host = $("picker");
  const show = on === undefined ? !host.classList.contains("on") : on;
  host.classList.toggle("on", show);
  if (show) renderPicker();
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

$("grab").addEventListener("click", () => togglePicker());

$("autosave").value = localStorage.getItem(AUTOSAVE_KEY) || "5";
if (!$("autosave").value) $("autosave").value = "5";
$("autosave").addEventListener("change", () => {
  localStorage.setItem(AUTOSAVE_KEY, $("autosave").value);
  armAutosave();
  const mins = autosaveMinutes();
  setStatus(mins === 0 ? "autosave off" : `draft every ${mins} min`, "draft");
});

// Closing the tab is the most ordinary way this work gets lost, and it is the
// one moment a normal fetch will not survive. sendBeacon is fire-and-forget and
// is not cancelled by the unload, so the last edits still reach a draft. No
// confirm dialog: this is a recovery net, not a nag.
addEventListener("beforeunload", () => {
  if (!dirty || !spec || autosaveMinutes() === 0) return;
  navigator.sendBeacon("/draft", new Blob([JSON.stringify({ spec })], { type: "application/json" }));
});
$("run").addEventListener("click", run);
$("reload").addEventListener("click", () => {
  if (dirty && !confirm("Reload from disk and lose the edits you have not written yet?")) return;
  load();
});

$("message").addEventListener("input", () => schedulePreview());

$("savemsg").addEventListener("click", async () => {
  const res = await (await fetch("/save-message", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ message: $("message").value }),
  })).json();
  if (res.error) setStatus(res.error, "bad");
  else setStatus(`message saved to ${res.file}`, "ok");
});

$("saveout").addEventListener("click", async () => {
  if (!lastOutput) { setStatus("nothing to save, write and run first", "bad"); return; }
  const file = prompt("Save transformed message as:", defaultOut);
  if (!file) return;
  const res = await (await fetch("/save-output", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ output: lastOutput, file }),
  })).json();
  if (res.error) setStatus(res.error, "bad");
  else setStatus(`saved ${res.bytes} bytes to ${res.file}`, "ok");
});

$("savecls").addEventListener("click", async () => {
  if (!lastIris) { setStatus("nothing to save yet", "bad"); return; }
  const suggested = `${(spec?.iris?.className ?? "Transform").split(".").pop()}.cls`;
  const file = prompt("Save the generated class as:", suggested);
  if (!file) return;
  const res = await (await fetch("/save-iris", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ iris: lastIris, file }),
  })).json();
  if (res.error) setStatus(res.error, "bad");
  else setStatus(`saved ${res.bytes} bytes to ${res.file}`, "ok");
});

// ---------------------------------------------------------------------------
// The ObjectScript workbench
//
// The other panes are printed FROM the spec and cannot describe an interface
// the bench does not run. This one is the other way round: it holds the class
// you maintain in Studio, and the engine runs it. Nothing here reads a class
// back into a spec -- a .cls is a thing to run, never an input to the mapping.
//
// Mounted only when the server was started with --script. Without it the tab
// stays hidden and /script answers 404, so the page cannot be talked into
// reading or writing a class it was not pointed at.
// ---------------------------------------------------------------------------

let scriptFile = null;

async function loadScript() {
  let res;
  try { res = await fetch("/script"); } catch { return; }
  if (!res.ok) return;                       // started without --script
  const s = await res.json();
  scriptFile = s.file;
  $("scripttab").hidden = false;
  $("scripttab").textContent = s.file.split(/[\\/]/).pop();
  $("scriptsrc").value = s.source;
  $("scriptwhere").textContent =
    `${s.file}  ->  ${s.engine}` + (s.encoding ? `   (was ${s.encoding}; decoded)` : "") +
    (s.present ? "" : "   (file not there yet)");
}

async function runScript() {
  const src = $("scriptsrc").value;
  if (!src.trim()) { $("scriptout").textContent = "Nothing to run."; return; }
  $("scriptout").textContent = "running in the engine...";
  let r;
  try {
    r = await (await fetch("/script/run", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        source: src,
        // The message PANE, not the file on disk. Editing the message and
        // re-running without saving is the whole reason this is here.
        message: $("message").value,
        method: $("scriptmethod").value,
      }),
    })).json();
  } catch (e) {
    $("scriptout").textContent = String(e);
    return;
  }

  const head = [];
  if (r.found) head.push(`read ${scriptFile} as ${r.found}`);
  if (r.removed && r.removed.length) {
    head.push(``, `${r.removed.length} line(s) removed before compiling:`);
    for (const x of r.removed) head.push(`  ${x}`);
  }
  if (r.error) {
    head.push(``, r.error);
    $("scriptout").textContent = head.join("\n");
    return;
  }
  if (r.segments === null) {
    head.push(``, "The code produced no target message.");
    head.push("For a gate that filters this event, that is the correct answer.");
    $("scriptout").textContent = head.join("\n");
    return;
  }

  // The spec's own output for the same message, so the two are on one screen.
  // That comparison is the thing this pane exists for: the class is what runs
  // in production, the spec is what the mapping document describes, and a
  // difference between them is a difference nobody else would have shown you.
  const specOut = ($("output").textContent || "").split("\n").map((l) => l.trimEnd()).filter(Boolean);
  const bad = [];
  const n = Math.max(specOut.length, r.segments.length);
  for (let i = 0; i < n; i++) {
    const a = specOut[i] ?? "(no segment)";
    const b = r.segments[i] ?? "(no segment)";
    if (a !== b) bad.push(`  ${i + 1}\n    spec   ${a}\n    class  ${b}`);
  }

  head.push(``, ...r.segments, ``, `engine ${r.engine}   ${r.ms} ms   ${r.segments.length} segment(s)`);
  if (r.status && r.status.trim()) head.push(`status ${r.status}`);
  head.push(``, bad.length === 0
    ? `DIFF vs spec: identical, ${r.segments.length} segment(s)`
    : `DIFF vs spec: ${bad.length} of ${n} segment(s) differ\n` + bad.join("\n"));

  $("scriptout").textContent = head.join("\n");
}

$("scriptrun").addEventListener("click", runScript);

// Read the class into the spec form, once.
//
// After this the SPEC is the artifact: the form edits it, every other pane is
// printed from it, and `bun emit.ts process` writes the class back. Importing a
// second time, after either side has moved, is how two sources of truth appear
// for one set of decisions -- which is the thing this bench is built to stop.
$("scriptimport").addEventListener("click", async () => {
  if (!confirm(
    "Read this class into the spec?\n\n" +
    "It REPLACES the spec the form is editing (a .bak is kept).\n" +
    "From then on the spec is the source and emit writes the class back."
  )) return;

  const r = await (await fetch("/script/import", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ source: $("scriptsrc").value }),
  })).json();

  if (r.error) { setStatus(r.error, "bad"); return; }

  const out = [`read into ${r.file}: ${r.blocks} block(s), ${r.rows} row(s)`, ``];
  for (const n of r.notes) out.push(`  ${n}`);
  if (r.unread.length) {
    out.push(``, `${r.unread.length} LINE(S) NOT UNDERSTOOD -- these decisions are NOT in the spec:`);
    for (const u of r.unread) out.push(`  line ${u.line}: ${u.text}`);
    out.push(``, `Read them before trusting the form. Each one is something the class`);
    out.push(`does and the spec does not, and nothing downstream can tell.`);
  } else {
    out.push(``, `Every line was understood. Check it against the original anyway --`);
    out.push(`an importer agrees with itself.`);
  }
  if (r.problems && r.problems.length) {
    out.push(``, `The imported spec does not validate yet:`);
    for (const p of r.problems) out.push(`  - ${p}`);
  }
  $("scriptout").textContent = out.join("\n");

  setStatus(
    r.unread.length ? `imported with ${r.unread.length} line(s) unread` : "imported cleanly",
    r.unread.length ? "bad" : "ok",
  );
  // The form must show what was just written, not the spec it replaced.
  await load();
});

// Spec -> class. The other half of the loop.
//
// It lands in the TEXTAREA, not on disk, because what comes out is NOT the
// class that went in. The bench emits one shape: a business process that
// clones the request, calls a DTL and dispatches. A hand-written OnRequest
// that does its mapping inline is a different shape doing the same job, and
// overwriting one with the other without looking is how a morning goes.
//
// Read it, run it against the message, THEN press Save class.
$("scriptfromspec").addEventListener("click", async () => {
  const r = await (await fetch("/script/fromspec", { method: "POST" })).json();
  if (r.error) { $("scriptout").textContent = r.error; setStatus("spec will not emit", "bad"); return; }

  $("scriptsrc").value = r.source;
  $("scriptout").textContent = [
    "Regenerated from the spec, into the box above. NOTHING IS SAVED YET.",
    "",
    "This is not the class you imported. The bench emits a process that calls a",
    "DTL; a hand-written OnRequest usually does the mapping inline. Same result,",
    "different shape -- and the DTL is a SECOND class you also have to deploy:",
    "",
    "  bun emit.ts -o <the DTL>.cls",
    "",
    "Run it here first, check the diff, then Save class.",
  ].join("\n");
  setStatus("class regenerated from the spec, unsaved", "ok");
});

$("scriptsave").addEventListener("click", async () => {
  const r = await (await fetch("/script/save", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ source: $("scriptsrc").value }),
  })).json();
  if (r.error) setStatus(r.error, "bad");
  else setStatus(`saved ${r.bytes} bytes to ${r.file}`, "ok");
});

// Ctrl+Enter runs, because the loop here is edit-run-edit and reaching for the
// button every time is what makes a workbench feel like a form.
$("scriptsrc").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runScript(); }
});

loadScript();

for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
  b.addEventListener("click", () => {
    for (const other of $("tabs").querySelectorAll("button[data-tab]")) other.classList.toggle("on", other === b);
    for (const pane of document.querySelectorAll(".tabpane")) {
      pane.classList.toggle("on", pane.id === `tab-${b.dataset.tab}`);
    }
  });
}

// ---------------------------------------------------------------------------
// Copying a tab
//
// The ObjectScript tab exists to be pasted into Studio, so getting it out has
// to be one motion. Dragging a selection over a 200 line class in a scrolling
// pane is not one motion, and a selection that stops one line short produces a
// class that does not compile for a reason nothing on screen explains.
// ---------------------------------------------------------------------------

/** The visible tab's text, as text rather than as markup. */
function activePaneText() {
  const pane = document.querySelector(".tabpane.on");
  if (!pane) return "";

  // The message pane is one div per segment, so textContent would run the
  // whole message onto a single line and lose the segment boundaries.
  const out = pane.querySelector("#output");
  if (out) return [...out.children].map((row) => row.textContent).join("\n");

  const pre = pane.querySelector("pre");
  return pre ? pre.textContent : pane.textContent;
}

/** Clipboard, with the pre-secure-context fallback still in reach. */
async function toClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }
}

let copyFlash = null;

async function copyActivePane() {
  const text = activePaneText();
  const b = $("copytab");
  if (text.trim() === "") {
    b.textContent = "empty";
  } else {
    const ok = await toClipboard(text);
    b.textContent = ok ? `copied ${text.split("\n").length} lines` : "copy failed";
    b.classList.toggle("done", ok);
  }
  clearTimeout(copyFlash);
  copyFlash = setTimeout(() => {
    b.textContent = "copy";
    b.classList.remove("done");
  }, 1400);
}

$("copytab").addEventListener("click", copyActivePane);

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }

  // Ctrl+C copies the visible tab, but only when the browser would otherwise
  // copy nothing. A real selection wins, and so does a focused field: taking
  // Ctrl+C away from an input the user is editing would be a worse bug than
  // the one this fixes.
  if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C")) {
    const tag = (document.activeElement?.tagName ?? "").toUpperCase();
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if ((window.getSelection()?.toString() ?? "") !== "") return;
    e.preventDefault();
    copyActivePane();
  }
});

await load();
</script>
</body>
</html>
